<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Happy Springs on Google Play</title>
<meta name="theme-color" content="#12302c"><link rel="icon" href="../img/favicon.png">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(180deg,#bfe6d8,#e9f6ec 70%,#fbf8ef);color:#14261f;text-align:center;padding:24px 16px;box-sizing:border-box}
img{width:min(78vw,340px);height:auto}
a.btn{display:block;width:min(86vw,340px);box-sizing:border-box;background:#12302c;color:#fff;text-decoration:none;font-weight:700;font-size:20px;border-radius:16px;padding:16px;box-shadow:0 4px 0 #0a1d1a}
a.alt{color:#2f6a2a;font-size:15px}
p{margin:0;color:#56665e;font-size:15px}
</style></head><body>
<img src="../img/logo.webp" alt="Happy Springs">
<a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.happysprings.game">Get it free on Google Play</a>
<p>Opening the Play Store&hellip; if nothing happens, tap the button.</p>
<a class="alt" href="market://details?id=com.happysprings.game">Open in the Play Store app</a>
<script>
(function () {
  var id = 'com.happysprings.game', web = 'https://play.google.com/store/apps/details?id=' + id;
  if (/android/i.test(navigator.userAgent)) {
    var intent = 'intent://details?id=' + id + '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
    document.getElementById('go').href = intent;
    setTimeout(function () { location.href = intent; }, 150);
  }
})();
</script>
</body></html>
